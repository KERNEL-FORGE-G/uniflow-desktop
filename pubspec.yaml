name: uniflow
description: Plateforme de gestion académique intelligente
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  fl_chart: ^0.68.0 # utilisé pour le graphique "Inscriptions par mois" du dashboard
  flutter_dotenv: ^6.0.1
  appwrite: ^26.2.0
  flutter_riverpod: ^2.6.1
  # `file_selector` plutôt qu'`image_picker` : c'est le paquet soutenu par
  # l'équipe Flutter pour Linux et Windows, où `image_picker` est peu fiable.
  file_selector: ^1.0.3
  # Signature des jetons d'accès LiveKit (HMAC-SHA256) par le service de
  # visioconférence embarqué. Déjà présent en dépendance transitive ; déclaré
  # explicitement puisqu'on l'importe directement.
  crypto: ^3.0.7
  # Ouverture des liens GitHub et mailto: depuis la page Équipe. Déjà présent
  # sur le mobile ; le desktop l'ignorait, ses liens n'étaient pas cliquables.
  url_launcher: ^6.3.2
  # Dossier de données de l'application, pour l'instantané de session et les
  # préférences : importé par `session_snapshot.dart` sans être déclaré,
  # l'analyseur le signalait (`depend_on_referenced_packages`).
  path_provider: ^2.1.5
  # Préférences locales réelles de l'écran Paramètres (thème, notifications,
  # dernier écran) : les interrupteurs étaient auparavant figés.
  shared_preferences: ^2.5.3
  # Client LiveKit : c'est lui qui rejoint la salle hébergée par le poste
  # (flutter_webrtc est sa dépendance, prise en charge sur Linux, Windows,
  # macOS et Android).
  livekit_client: ^2.13.0
  # QR code du lien de participation affiché à l'hôte, pour qu'un téléphone du
  # réseau local rejoigne la salle sans recopier l'adresse.
  qr_flutter: ^4.1.0
  # Exports de la feuille de présence d'une réunion, produits sur le poste
  # (donc disponibles hors ligne) : un PDF à imprimer ou joindre, un classeur
  # à retravailler par le secrétariat.
  pdf: ^3.12.0
  excel: ^4.0.6
  # Icônes Phosphor (`duotone`, `fill`, `bold`) : la seule famille d'icônes
  # des trois clients depuis le 2026-09-21 (`docs/icones-uniflow.md`). Les
  # icônes Material filaires ne sont plus admises sur la navigation, les
  # tableaux de bord, les cours et l'espace personnel.
  # Polices uniquement (`fontPackage: 'phosphor_flutter'`) : ne pas importer
  # son code Dart, qui étend `IconData` — classe `final` depuis Flutter 3.47 —
  # et ne compile plus. Les glyphes sont recopiés dans
  # `lib/widgets/phosphor.dart` par `tool/generate_phosphor_glyphs.dart`.
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # Logos de marque détourés (fond transparent) : l'écusson carré pour les
    # icônes, le logotype horizontal pour les surfaces larges et claires.
    - assets/brand/
    # Page web de participation à une visioconférence, servie par le poste hôte
    # aux navigateurs du réseau local (bundle livekit-client inclus, Apache-2.0).
    - assets/conference_web/
    # Uni, la mascotte (12 poses WebP), son avatar et le logo KERNEL FORGE :
    # embarqués pour s'afficher hors ligne et sur les écrans d'erreur, là où
    # rien ne peut plus être téléchargé.
    - assets/mascot/
    - assets/assistant/
    - assets/logos/
    - assets/onboarding/
    # Médailles des badges étudiants (même images que le mobile) : embarquées
    # pour s'afficher hors ligne dans la section Badges du tableau de bord.
    - assets/badges/
    - assets/auth/
    # Illustrations 3D générées pour le redesign "SkillSet" : hero banner,
    # thumbnails de cours pour les cartes d'accueil du dashboard.
    - assets/illustrations/
    # Scans officiels des emplois du temps (ICT4D, SIGL, Faculté des Sciences)
    - assets/emplois_du_temps/
    # Photos et mascottes des membres de l'équipe KERNEL FORGE
    - assets/team/
    - .env
  # Inter (SIL OFL 1.1, licence dans assets/fonts/) : la police du web.
  # Le thème la nommait sans l'embarquer et Flutter retombait sur la police
  # système, d'où un desktop qui ne ressemblait pas au web.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

# ── Configuration MSIX / Microsoft Store ────────────────────────────────────
# Ces clés sont lues UNIQUEMENT depuis pubspec.yaml (pas depuis
# windows/packaging/msix/make_config.yaml) par msix 3.18.0 :
# `languages`, `protocol_activation`, `startup_task`, `context_menu`,
# `toast_activator`.
# Les autres champs d'identité (publisher, identity_name, display_name,
# publisher_display_name, store, logo_path, capabilities) vivent dans
# make_config.yaml pour éviter la duplication.
# Identité Partner Center : KERNELFORGE.Uniflowwork (relevé 29/09/2026)
# PFN : KERNELFORGE.Uniflowwork_3wyzhk1x8xr0a
msix_config:
  # Langues déclarées dans le manifeste Appx.
  # Le Store les utilise pour le ciblage géographique des acquisitions.
  # fr-CM = Français (Cameroun), fr-FR = Français (France), en-US = anglais.
  languages: 'fr-CM, fr-FR, en-US'

  # Redirection de protocole : uniflow:// ouvre l'app depuis le navigateur
  # (liens d'invitation à une visioconférence, liens de réinitialisation).
  # Le Store exige que le protocole soit déclaré ici pour les apps Store.
  protocol_activation: 'uniflow'

  # Tâche de démarrage Windows : permet le démarrage automatique au login
  # (optionnel, désactivé par défaut, l'utilisateur peut l'activer
  # dans Paramètres Windows › Applications de démarrage).
  startup_task: 'false'

