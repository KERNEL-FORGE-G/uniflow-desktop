# Intégration continue d'UniFlow Desktop : un seul fichier, des jobs chaînés.
#
# `qualite` garde la porte (format, analyse, tests) ; les trois builds ne
# démarrent que s'il passe, et `release` ne publie que sur un tag `v*`.
# Voir docs/integration-continue.md.
name: UniFlow Desktop

on:
  push:
    branches: [main, feature/frontend-uniflow-app]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un nouveau push sur la même branche annule le run précédent : les builds
# Windows et Android durent plusieurs minutes, les laisser courir pour un
# commit déjà remplacé gaspille les minutes du dépôt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  qualite:
    name: Qualité (format, analyse, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyse statique
        run: flutter analyze
      - name: Tests
        run: flutter test --coverage

  build-linux:
    name: Build Linux
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: |
          sudo apt-get update
          # libwebkit2gtk-4.1-dev est requis par `desktop_webview_window`, tiré par
          # `flutter_web_auth_2` lui-même tiré par le SDK Appwrite. Sans lui, CMake
          # échoue sur `pkg_check_modules(webkit2gtk-4.0)` et le build Linux casse.
          # libpulse-dev : le plugin flutter_webrtc (visioconférence) lie PulseAudio
          # quand il le trouve ; sans les en-têtes, l'édition de liens échoue.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev libwebkit2gtk-4.1-dev libpulse-dev
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Fichier .env (Appwrite Cloud)
        run: bash .github/scripts/write-env.sh
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          APPWRITE_STORAGE_BUCKET_ID: ${{ secrets.APPWRITE_STORAGE_BUCKET_ID }}
          APPWRITE_API_FUNCTION_ID: ${{ secrets.APPWRITE_API_FUNCTION_ID }}
      - run: flutter build linux --release
      - name: Archive du bundle
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf dist/uniflow-desktop-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-linux
          path: dist/uniflow-desktop-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build Windows (installateur .exe, paquet .msix)
    needs: qualite
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Fichier .env (Appwrite Cloud)
        shell: bash
        run: bash .github/scripts/write-env.sh
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          APPWRITE_STORAGE_BUCKET_ID: ${{ secrets.APPWRITE_STORAGE_BUCKET_ID }}
          APPWRITE_API_FUNCTION_ID: ${{ secrets.APPWRITE_API_FUNCTION_ID }}
      - name: Inno Setup 6
        shell: powershell
        # `flutter_distributor` ne compresse rien lui-même : il engendre un
        # script Inno Setup depuis windows/packaging/exe/make_config.yaml puis
        # appelle ISCC.exe. Sans Inno installé, le maker `exe` lève
        # « Inno Setup 6 was not installed ».
        run: choco install innosetup --no-progress -y
      - name: Compilation de l'installateur
        shell: pwsh
        # Le même appel que sur le poste d'un développeur Windows, à ceci près
        # que la version vient du pubspec (l'outil lit `pubspec.yaml` lui-même).
        # `--no-version-check` : par défaut l'outil interroge pub.dev à chaque
        # lancement et imprime un spinner — une dépendance réseau de plus,
        # gratuite à supprimer.
        # `dart pub global run flutter_distributor:main` plutôt que le shim
        # `flutter_distributor.bat` : le répertoire `bin` de pub global n'est
        # pas dans le PATH du runner, et `executables:` mappe
        # `flutter_distributor` sur `bin/main.dart`.
        run: |
          $ErrorActionPreference = 'Stop'
          # Version épinglée : c'est celle dont le comportement a été lu dans
          # `.pub-cache` (le maker `exe`, ses noms de champs, son dossier de
          # sortie). Une montée de version doit être un choix, pas une surprise
          # de la CI.
          dart pub global activate flutter_distributor 0.6.10
          dart pub global run flutter_distributor:main --no-version-check `
            package --platform windows --targets exe --skip-clean
          if ($LASTEXITCODE -ne 0) {
            throw "flutter_distributor a rendu le code $LASTEXITCODE."
          }
          # L'appel sort en code 0 même quand aucun paquet n'a été produit (il
          # se contente d'un avertissement si une étape est sautée) : c'est
          # l'étape suivante qui attrape le problème, pas celle-ci.
          # L'outil range le paquet dans `dist/<version>/` (ici
          # `dist/1.0.0+1/`) : il faut donc chercher en profondeur, le motif
          # `dist\*-windows-setup.exe` ne correspondrait à rien.
          $setup = Get-ChildItem "$($env:GITHUB_WORKSPACE)\dist" -Recurse -Filter '*-windows-setup.exe' |
            Select-Object -First 1
          if (-not $setup) {
            throw "Aucun installateur sous dist/ après flutter_distributor."
          }
          # L'identité gravée dans le script Inno décide du nom de la clé
          # d'enregistrement et du rattachement des mises à jour : imprimée ici,
          # elle ne se devine plus quand la vérification d'après-installation
          # échoue. Le maker écrit `<base>_exe.iss` à côté de l'installateur.
          $iss = Join-Path $setup.DirectoryName "$($setup.BaseName)_exe.iss"
          if (Test-Path $iss) { Get-Content $iss } else { Write-Warning "Script Inno introuvable : $iss" }
          # Transmis à l'étape de vérification : reconstruire le motif `1.0.0+1`
          # en PowerShell serait plus fragile que de le garder en mémoire ici.
          "SETUP_EXE=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Installation silencieuse, vérification, désinstallation
        shell: pwsh
        # Le Store et winget n'acceptent pas un installateur qu'ils ne savent pas
        # poser sans interaction ni retirer proprement. Ces trois vérifications
        # sont ce que leurs bots rejouent : les jouer ici évite une semaine
        # d'allers-retours avec un `Needs-Author-Feedback`.
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-Item $env:SETUP_EXE

          # Dossier d'installation imposé par /DIR : rien n'est deviné de
          # l'emplacement par défaut ni du contexte de sécurité du runner.
          $cible = "$env:RUNNER_TEMP\uniflow-installation-essai"
          $install = Start-Process $exe.FullName `
            -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES',"/DIR=$cible" `
            -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installation silencieuse refusée : code retour $($install.ExitCode)."
          }

          # `uniflow.exe` : nom du lanceur Windows, donné par BINARY_NAME dans
          # windows/CMakeLists.txt — ce n'est PAS `uniflow_app.exe`, qui est le
          # nom du binaire Linux (autre CMakeLists, autre valeur).
          $binaire = Join-Path $cible 'uniflow.exe'
          if (-not (Test-Path $binaire)) {
            $vu = (Get-ChildItem $cible -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Name }) -join ' '
            throw "uniflow.exe absent de $cible. Ce que l'installateur y a laissé : $vu"
          }

          # Le nom de la clé d'enregistrement est `<AppId>_is1` : la doc Inno
          # Setup le dit littéralement (« AppId also determines the actual name
          # of the Uninstall registry key, to which Inno Setup tacks on "_is1" »)
          # et rien dans le maker n'ajoute ce suffixe à la place.
          # Sa ruche, elle, dépend du jeton du processus et non de la
          # configuration : `Setup.MainFunc.pas` pose le mode d'installation
          # machine par `InitializeAdminInstallMode(IsAdmin and
          # (PrivilegesRequired <> prLowest))`. Le compte `runneradmin` d'un
          # runner GitHub est administrateur, donc avec `privileges_required:
          # none` l'installateur écrit bien en HKLM ici — et en HKCU sur le
          # poste d'élève sans droit. Ne tester que HKCU faisait échouer la CI
          # pour un motif qui n'existe pas chez l'utilisateur.
          # `shell: pwsh` est le PowerShell 7 64 bits du runner : il lit la même
          # vue du registre que l'installateur, qui pose en 64 bits
          # (`architectures_install_in_64bit_mode`). Un `powershell` 32 bits
          # chercherait dans `WOW6432Node` et ne verrait rien.
          $nom = 'codes.kernelforge.uniflow_is1'
          $racine = 'SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall'
          # `@(...)` : sans lui, un seul résultat de `Where-Object` est déroulé
          # en chaîne, et `$ruches[0]` rendrait alors le premier caractère de
          # « HKLM » — un chemin qui commencerait par « H ».
          $ruches = @(@('HKCU', 'HKLM') | Where-Object { Test-Path "${_}:\$racine\$nom" })
          if ($ruches.Count -eq 0) {
            $voisines = @(Get-ChildItem "HKCU:\$racine", "HKLM:\$racine" -ErrorAction SilentlyContinue |
              ForEach-Object { $_.PSChildName }) -join ' '
            throw "Entrée de désinstallation « $nom » introuvable, en HKCU comme en HKLM. Clés voisines : $voisines"
          }
          if ($ruches.Count -gt 1) {
            throw "Entrée de désinstallation présente à la fois en HKCU et en HKLM : « Applications et fonctionnalités » afficherait UniFlow deux fois."
          }
          # Ce que winget et l'appli « Applications et fonctionnalités » lisent
          # pour afficher le nom et proposer le retrait du paquet.
          $info = Get-ItemProperty "$($ruches[0]):\$racine\$nom"
          if (-not $info.UninstallString) {
            throw "Clé présente en $($ruches[0]) mais sans UninstallString : ni winget ni « Applications et fonctionnalités » ne pourraient retirer le paquet."
          }

          $desinstall = Start-Process (Join-Path $cible 'unins000.exe') `
            -ArgumentList '/VERYSILENT','/NORESTART' -Wait -PassThru
          if ($desinstall.ExitCode -ne 0) {
            throw "Désinstallation silencieuse refusée : code retour $($desinstall.ExitCode)."
          }
          if (Test-Path $binaire) { throw "Le binaire survit à la désinstallation." }
          foreach ($ruche in $ruches) {
            if (Test-Path "${ruche}:\$racine\$nom") {
              throw "La clé d'enregistrement survit à la désinstallation en $ruche : « Applications et fonctionnalités » garderait un UniFlow fantôme."
            }
          }

          # Ces valeurs sont celles qu'exige une demande winget (chemin, hachage,
          # commutateurs) et le formulaire « Packages » du Store.
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $taille = '{0:N1} Mo' -f ($exe.Length / 1MB)
          @(
            "### Installateur Windows",
            "",
            "| Champ | Valeur |",
            "| --- | --- |",
            "| Fichier | ``$($exe.Name)`` |",
            "| Taille | ``$taille`` |",
            "| Clé d'enregistrement | ```$($ruches[0])\$racine\$nom``` |",
            "| DisplayName / UninstallString | ``$($info.DisplayName)`` / ``$($info.UninstallString)`` |",
            "| InstallerSha256 | ``$sha`` |",
            "| Silent / SilentWithProgress | ``/VERYSILENT /SUPPRESSMSGBOXES /NORESTART`` |",
            "| Code de retour installation réussie | ``0`` |"
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-windows
          path: dist/**/*-windows-setup.exe
          if-no-files-found: error
          retention-days: 3

      # Le paquet que le Microsoft Store accepterait. Il est traité après
      # l'installateur `.exe`, artifact déjà rangé : une étape verte/rouge ici ne
      # doit pas pouvoir faire perdre le paquet de la page Téléchargements.
      - name: Identité gravée dans la configuration MSIX
        id: identite-msix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = 'windows/packaging/msix/make_config.yaml'
          # `^\s*identity_name:` et pas une recherche libre : le fichier contient
          # une ligne `# identity_name: '...'` qui est une consigne, pas une
          # valeur. La compter comme saisie produirait un paquet à identité vide,
          # téléversable en apparence et rejeté par Partner Center.
          $ligne = Select-String -Path $config -Pattern "^\s*identity_name:\s*'([^']+)'" |
            Select-Object -First 1
          if (-not $ligne) {
            @(
              '### Paquet MSIX téléversable non produit',
              '',
              '`windows/packaging/msix/make_config.yaml` est sans `identity_name`.',
              'Le run fabriquera donc le paquet **de test** (identité inventée, ' +
              'certificat auto-signé) et non celui du Store.',
              'Lire la valeur dans Partner Center › UNIFLOW DESKTOP › Détails de',
              'l''identité de l''application (Product management › View app identity',
              'details), champ « Package ID », et couper au premier `_` : au-delà',
              'c''est le package family name, et le champ refuse le tiret bas.',
              'Voir `docs/store/rejet-10.2.9-et-voie-msix.md`.'
            ) | Add-Content $env:GITHUB_STEP_SUMMARY
            Write-Warning "identity_name absent : seul le paquet MSIX de test sera produit."
            exit 0
          }
          "identity=$($ligne.Matches[0].Groups[1].Value)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Paquet MSIX pour le Microsoft Store
        id: paquet-msix
        if: steps.identite-msix.outputs.identity != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dart pub global run flutter_distributor:main --no-version-check `
            package --platform windows --targets msix --skip-clean
          if ($LASTEXITCODE -ne 0) {
            throw "flutter_distributor a rendu le code $LASTEXITCODE pour la cible msix."
          }
          $msix = Get-ChildItem "$($env:GITHUB_WORKSPACE)\dist" -Recurse -Filter '*.msix' |
            Select-Object -First 1
          if (-not $msix) { throw "Aucun .msix sous dist/ après flutter_distributor." }

          # Le nom finit par `-store.msix` : c'est le motif exact que la release
          # GitHub attrape. Le paquet de test porte `-test.msix` et reste dans le
          # magasin d'artefacts — les deux coexistent dans `dist/` du job de
          # téléchargement, une extension commune ne doit pas suffire à les
          # confondre.
          $versStore = Join-Path $msix.Directory.FullName "$($msix.BaseName)-store.msix"
          Move-Item -LiteralPath $msix.FullName -Destination $versStore -Force
          $msix = Get-Item -LiteralPath $versStore

          # L'identité n'est pas celle qu'on a écrite dans le YAML : c'est celle
          # que le paquet contient. `Expand-Archive` refuse l'extension `.msix`,
          # d'où la copie en `.zip` — le paquet est un zip Appx, rien n'est
          # transformé.
          $extrait = Join-Path $env:RUNNER_TEMP 'msix-identite'
          $zip = Join-Path $env:RUNNER_TEMP 'paquet.zip'
          Copy-Item $msix.FullName $zip -Force
          Expand-Archive -Path $zip -DestinationPath $extrait -Force
          $manifeste = Get-Content (Join-Path $extrait 'AppxManifest.xml') -Raw
          $identite = [regex]::Match($manifeste, '<Identity[^>]+>').Value
          if (-not $identite) { throw "AppxManifest.xml sans <Identity>." }
          $Familles = ([regex]::Matches($manifeste, '<TargetDeviceFamily[^>]+Name="([^"]+)"[^>]+MinVersion="([^"]+)"') |
            ForEach-Object { "$($_.Groups[1].Value) >= $($_.Groups[2].Value)" }) -join ' · '

          $sha = (Get-FileHash $msix.FullName -Algorithm SHA256).Hash.ToLower()
          $taille = '{0:N1} Mo' -f ($msix.Length / 1MB)
          @(
            '### Paquet MSIX (Microsoft Store)',
            '',
            '| Champ | Valeur |',
            '| --- | --- |',
            "| Fichier | ``$($msix.Name)`` |",
            "| Taille | ``$taille`` |",
            "| SHA-256 | ``$sha`` |",
            "| Identité gravée | ``$identite`` |",
            "| Familles d'appareils | ``$Familles`` |",
            '',
            'Signé par le Store à la certification : le paquet est déposé non signé, ' +
            'c''est ce que `store: true` produit et ce que la voie MSIX autorise.'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
          "msix=$($msix.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Téléversement du paquet MSIX
        if: steps.paquet-msix.outputs.msix != ''
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-windows-msix
          path: ${{ steps.paquet-msix.outputs.msix }}
          if-no-files-found: error
          retention-days: 3

      # Même chaîne de build, identité de test : le paquet ci-dessus ne peut
      # exister qu'avec le Package ID lu dans Partner Center. En l'attendant,
      # cette étape garantit qu'un run vert produit toujours un `.msix` —
      # installable sur une machine où le certificat de test est approuvé, et
      # qui prouve que `make_config.yaml`, les icônes et les VCLibs embarqués
      # tiennent. Elle est la condition inverse de l'étape Store : les deux ne
      # s'exécutent jamais sur le même run.
      - name: Paquet MSIX de test, signé par le certificat fourni par msix
        id: paquet-msix-test
        if: steps.identite-msix.outputs.identity == ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = 'windows/packaging/msix/make_config.yaml'

          # `store` est un DRAPEAU dans msix 3.18.0 : écrire `store: 'false'`
          # l'active quand même (le YAML charge la chaîne non vide comme vrai).
          # La seule façon d'obtenir store=false est de supprimer la ligne.
          $avant = Get-Content $config
          $sansDrapeau = @($avant | Where-Object { $_ -notmatch "^\s*store:" })
          if ($sansDrapeau.Count -ge $avant.Count) {
            throw 'Aucune ligne store: à retirer dans make_config.yaml : le drapeau est déjà absent, la signature de test ne peut pas être forcée.'
          }

          # Une fois `store` absent, msix prend la branche `signMsix && !store`
          # (msix.dart l. 125 et 140) : il signe avec le certificat de test
          # livré dans le paquet `msix` (sujet `CN=Msix Testing, O=Msix Testing
          # Corporation, S=Some-State, C=US`) et écrit ce sujet dans `publisher`
          # avant de générer l'AppxManifest (sign_tool.dart l. 23-43). L'identité,
          # elle, doit être syntaxiquement valide (`^[a-zA-Z0-9.-]{3,50}$`) sans
          # ressembler à la vraie.
          #
          # `install_certificate: 'false'` n'est pas un détail : sans lui,
          # `_packMsixFiles` appelle `SignTool.installCertificate()` (msix.dart
          # l. 143-147), qui n'a pas trouvé le certificat dans
          # `Cert:\CurrentUser\Root` — cas d'un runner neuf — et demande alors
          # `Do you want to install the certificate … (y/N)` sur stdin
          # (sign_tool.dart l. 166). Un stdin non interactif rend la valeur
          # nulle et le build tombe. L'option est un `addOption`
          # (configuration.dart l. 403) : `'false'` la désactive, contrairement
          # au drapeau `store`.
          #
          # Pas de `signtool_options` ici. Le run #61 en portait un
          # (`/f "<pfx>" /p 1234 /fd SHA256`, pour éviter l'horodatage réseau) :
          # `signtool` a échoué sur `SignerSign() … 0x8007000b`, c'est-à-dire,
          # pour un paquet Appx, un `Publisher` du manifeste différent du sujet
          # du certificat. La raison est dans le chemin qui mène à ce sujet :
          # avec une commande personnalisée, `msix` relit le certificat via
          # `_getCertificateSubjectByFile(true)`, donc par `powershell.exe` avec
          # le **chemin tel que `CommandLineConverter` l'a rendu**, et
          # `exitOnError()` ne regarde que le code de sortie
          # (`method_extensions.dart` l. 74-79) — un `X509Certificate2()` qui
          # lève en erreur non terminative sort 0 avec stdout vide, le sujet
          # reste vide, `publisher` n'est PAS réécrit, et le manifeste part avec
          # le `CN=3a54a224-…` de Partner Center collé à une signature
          # « Msix Testing ». Sans `signtool_options`, le sujet vient de
          # `_config.certificatePath`, une chaîne Dart propre, sans allers-retours
          # de guillemets. L'horodatage par défaut n'est pas un risque mesuré :
          # `http://timestamp.digicert.com` répond 200 et 6 008 octets en 0,5 s
          # à une requête RFC 3161 construite en local.
          $sansDrapeau += "identity_name: 'codes.kernelforge.uniflowtest'"
          $sansDrapeau += "install_certificate: 'false'"
          Set-Content -Path $config -Value $sansDrapeau -Encoding utf8NoBOM

          try {
            dart pub global run flutter_distributor:main --no-version-check `
              package --platform windows --targets msix --skip-clean
            if ($LASTEXITCODE -ne 0) {
              throw "flutter_distributor a rendu le code $LASTEXITCODE pour la cible msix (variante de test)."
            }
          } catch {
            # `MakeAppx` a terminé avant que `signtool` ne parle : le fichier
            # sous dist/ existe, non signé. Le lire ici coûte dix secondes et
            # évite un run de plus pour savoir quel éditeur le manifeste porte.
            $rebut = Get-ChildItem "$($env:GITHUB_WORKSPACE)\dist" -Recurse -Filter '*.msix' |
              Select-Object -First 1
            if ($rebut) {
              $zipRebut = Join-Path $env:RUNNER_TEMP 'paquet-non-signe.zip'
              $extraitRebut = Join-Path $env:RUNNER_TEMP 'manifeste-non-signe'
              Copy-Item $rebut.FullName $zipRebut -Force
              Expand-Archive -Path $zipRebut -DestinationPath $extraitRebut -Force
              $manifesteRebut = Get-Content (Join-Path $extraitRebut 'AppxManifest.xml') -Raw
              @(
                '### Signature du paquet MSIX de test échouée',
                '',
                "L`'AppxManifest du paquet non signé porte : " +
                [regex]::Match($manifesteRebut, '<Identity[^>]+>').Value,
                '',
                'Sur un paquet Appx, `0x8007000b` = éditeur du manifeste différent ' +
                'du sujet du certificat, champ pour champ.'
              ) | Add-Content $env:GITHUB_STEP_SUMMARY
            }
            throw
          }

          $msix = Get-ChildItem "$($env:GITHUB_WORKSPACE)\dist" -Recurse -Filter '*.msix' |
            Select-Object -First 1
          if (-not $msix) { throw "Aucun .msix sous dist/ après flutter_distributor." }

          # Suffixe distinct : la release GitHub n'attrape que `*-store.msix`.
          $versTest = Join-Path $msix.Directory.FullName "$($msix.BaseName)-test.msix"
          Move-Item -LiteralPath $msix.FullName -Destination $versTest -Force
          $msix = Get-Item -LiteralPath $versTest

          $extrait = Join-Path $env:RUNNER_TEMP 'msix-test-identite'
          $zip = Join-Path $env:RUNNER_TEMP 'paquet-test.zip'
          Copy-Item $msix.FullName $zip -Force
          Expand-Archive -Path $zip -DestinationPath $extrait -Force
          $manifeste = Get-Content (Join-Path $extrait 'AppxManifest.xml') -Raw
          $identite = [regex]::Match($manifeste, '<Identity[^>]+>').Value
          if (-not $identite) { throw "AppxManifest.xml sans <Identity>." }
          $editeur = [regex]::Match($manifeste, 'Publisher="([^"]+)"').Groups[1].Value

          $taille = '{0:N1} Mo' -f ($msix.Length / 1MB)
          @(
            '### Paquet MSIX de test (non téléversable)',
            '',
            '`identity_name` est vide dans `make_config.yaml` : le build a été ' +
            'conduit avec une identité de test et le certificat auto-signé ' +
            'livré avec le paquet `msix`.',
            '',
            '| Champ | Valeur |',
            '| --- | --- |',
            "| Fichier | ``$($msix.Name)`` |",
            "| Taille | ``$taille`` |",
            '| Identité gravée | `' + $identite + '` |',
            '| Éditeur (sujet du certificat de test) | `' + $editeur + '` |',
            '',
            '**À ne pas téléverser dans Partner Center** : la signature ne ' +
            'chaîne à aucune autorité du *Microsoft Trusted Root Program*, et ' +
            'le nom du paquet n''est pas celui du produit. Il disparaît dès que ' +
            'l''étape « Paquet MSIX pour le Microsoft Store » s''exécute, c''est-à-dire ' +
            'dès que `identity_name` est renseigné.',
            '',
            'Instalable sur une machine, en administrateur, avec le `.pfx` ' +
            'livré dans le paquet `msix` :',
            '',
            '```powershell',
            '$pfx = "$env:LOCALAPPDATA\\Pub\\Cache\\hosted\\pub.dev\\' +
            'msix-3.18.0\\lib\\assets\\test_certificate.pfx"',
            'Import-PfxCertificate -CertStoreLocation Cert:\\LocalMachine\\Root ' +
            '-FilePath $pfx `',
            '  -Password (ConvertTo-SecureString -String ''1234'' -Force -AsPlainText)',
            'Add-AppxPackage -Path .\'' + $msix.Name + '\'',
            '```',
            '',
            'C''est la chaîne de build qui est validée ici, pas la distribution.'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
          "msixTest=$($msix.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Téléversement du paquet MSIX de test
        if: steps.paquet-msix-test.outputs.msixTest != ''
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-windows-msix-test
          path: ${{ steps.paquet-msix-test.outputs.msixTest }}
          if-no-files-found: error
          retention-days: 3

  build-android-tablet:
    name: Build Android (tablette)
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          # Java 21 : compatible avec Gradle 9.1 et au-dessus du minimum exigé
          # par AGP 9.0.1. Le projet compile de toute façon en bytecode 17.
          java-version: '21'
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Fichier .env (Appwrite Cloud)
        run: bash .github/scripts/write-env.sh
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
          APPWRITE_STORAGE_BUCKET_ID: ${{ secrets.APPWRITE_STORAGE_BUCKET_ID }}
          APPWRITE_API_FUNCTION_ID: ${{ secrets.APPWRITE_API_FUNCTION_ID }}
      - run: flutter build apk --release
      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/uniflow-desktop-tablette.apk
      - uses: actions/upload-artifact@v4
        with:
          name: uniflow-desktop-android-tablette
          path: dist/uniflow-desktop-tablette.apk
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publication GitHub
    needs: [build-linux, build-windows, build-android-tablet]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/uniflow-desktop-linux-x64.tar.gz
            dist/**/*-windows-setup.exe
            dist/**/*-store.msix
            dist/uniflow-desktop-tablette.apk
          generate_release_notes: true
