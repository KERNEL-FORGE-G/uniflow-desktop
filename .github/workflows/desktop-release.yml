name: Build & Release Uniflow work Desktop (Windows Store / MSI / EXE & Linux DEB / AppImage / RPM)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  VITE_APPWRITE_ENDPOINT: https://vps.kernelforge.codes/v1
  VITE_APPWRITE_PROJECT_ID: uniflow
  VITE_APPWRITE_DATABASE_ID: uniflow
  VITE_APPWRITE_INDEPENDANT_DATABASE_ID: independant
  VITE_MS_STORE_APP_NAME: Uniflow work
  VITE_MS_STORE_IDENTITY_NAME: KERNELFORGE.Uniflowwork
  VITE_MS_STORE_PUBLISHER: CN=200A91F7-4B15-441F-9332-83F216885B09
  VITE_MS_STORE_PUBLISHER_DISPLAY: KERNEL FORGE
  VITE_MS_STORE_PFN: KERNELFORGE.Uniflowwork_3wyzhk1x8xr0a
  VITE_MS_STORE_SID: S-1-15-2-3173161051-1525954667-3862484852-2055131400-1678586278-65818988-3190942280
  VITE_MS_STORE_ID: 9NGZKFGK98K6

jobs:
  build-linux:
    name: Build Linux (.deb, .AppImage, .rpm)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux WebKit2GTK & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            file \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Frontend & Tauri Linux Bundles (.deb, .AppImage, .rpm)
        run: pnpm tauri build --bundles deb,appimage,rpm

      - name: Upload Linux Installers (.deb, .AppImage, .rpm)
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-work-linux-x64-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  build-windows:
    name: Build Windows (.msi, .exe NSIS & Microsoft Store AppxManifest)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Validate & Stage Microsoft Store AppxManifest.xml (KERNELFORGE.Uniflowwork / 9NGZKFGK98K6)
        shell: pwsh
        run: |
          if (!(Test-Path "src-tauri/windows/AppxManifest.xml")) {
            Write-Error "Missing AppxManifest.xml"
            exit 1
          }
          $manifest = Get-Content "src-tauri/windows/AppxManifest.xml" -Raw
          if ($manifest -notmatch "KERNELFORGE\.Uniflowwork" -or $manifest -notmatch "CN=200A91F7-4B15-441F-9332-83F216885B09") {
            Write-Error "Invalid Microsoft Store Partner Center Identity in AppxManifest.xml"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "src-tauri/target/release/bundle/msix" | Out-Null
          Copy-Item "src-tauri/windows/AppxManifest.xml" "src-tauri/target/release/bundle/msix/AppxManifest.xml" -Force

      - name: Build Frontend & Tauri Windows Bundles (.msi, .exe NSIS)
        run: pnpm tauri build --bundles msi,nsis

      - name: Upload Windows Installers (.msi, .exe, AppxManifest.xml)
        uses: actions/upload-artifact@v4
        with:
          name: uniflow-work-windows-x64-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msix/AppxManifest.xml
            src-tauri/windows/AppxManifest.xml

  publish-release:
    name: Publish GitHub Release (Windows & Linux Installers)
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release with .msi, .exe, .deb, .AppImage, .rpm
        uses: softprops/action-gh-release@v2
        with:
          name: "Uniflow work ${{ github.ref_name }} — KERNEL FORGE (Store ID: 9NGZKFGK98K6)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.rpm
            release-artifacts/**/AppxManifest.xml
